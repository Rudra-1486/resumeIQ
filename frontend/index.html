<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366F1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z'/><polyline points='14 2 14 8 20 8'/><path d='m9 15 2 2 4-4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeIQ AI — Analyze Your Resume. Discover Your Potential.</title>
    <meta name="description" content="AI-powered resume quality analysis, job match evaluation, ATS readability checks, and truthful bullet rewriting." />

    <!-- PRD Section 20.2: Synchronous Anti-Flash Theme Script -->
    <script>
      (function() {
        try {
          var rawPrefs = localStorage.getItem('resumeiq_ui_preferences_v1');
          var selectedTheme = 'dark'; // PRD Section 19.2 & 20.1 Default
          if (rawPrefs) {
            var parsed = JSON.parse(rawPrefs);
            if (parsed && typeof parsed.theme === 'string') {
              selectedTheme = parsed.theme;
            }
          }
          var isDark = false;
          if (selectedTheme === 'dark') {
            isDark = true;
          } else if (selectedTheme === 'light') {
            isDark = false;
          } else if (selectedTheme === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = true;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Safe fallback to dark mode on error
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
